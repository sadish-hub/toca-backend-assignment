services:
  db:
    image: postgres:16
    container_name: toca-postgres
    environment:
      POSTGRES_USER: toca
      POSTGRES_PASSWORD: toca
      POSTGRES_DB: toca_packs
    volumes:
      - toca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toca -d toca_packs']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_USER: toca
      DATABASE_PASSWORD: toca
      DATABASE_NAME: toca_packs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:8080/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  toca_pgdata:
