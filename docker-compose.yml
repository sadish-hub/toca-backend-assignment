# Fixed container_name keeps local migrate docs simple, but a leftover one-off
# `toca-postgres` (outside this Compose project) will block `db` and leave the
# API unable to resolve hostname `db` (ENOTFOUND db). Use `make up` (conflict
# check) or: docker rm -f toca-postgres && docker compose up --build -d --wait
services:
  db:
    image: postgres:16
    container_name: toca-postgres
    labels:
      com.toca.role: compose-db
    environment:
      POSTGRES_USER: toca
      POSTGRES_PASSWORD: toca
      POSTGRES_DB: toca_packs
    volumes:
      - toca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toca -d toca_packs']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        # Default secure TLS. Set to "true" only on TLS-intercepting networks:
        # ALLOW_INSECURE_NPM_SSL=true docker compose build
        ALLOW_INSECURE_NPM_SSL: ${ALLOW_INSECURE_NPM_SSL:-false}
    container_name: toca-api
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_USER: toca
      DATABASE_PASSWORD: toca
      DATABASE_NAME: toca_packs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:8080/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  toca_pgdata:
